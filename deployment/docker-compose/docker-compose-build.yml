# Full stack from source: build API + web images locally (dev / QA).
#
# Same service names and volumes as docker-compose-prod.yml — do not run both stacks
# on one host at the same time (container_name and volume names would clash).
#
# From repo root:
#   npm run compose:build
#   # or:
#   docker compose -f deployment/docker-compose/docker-compose-build.yml --env-file deployment/docker-compose/.env up -d --build
#
# Optional: set APP_VERSION in deployment/docker-compose/.env so GET /health and the UI
# match your test tag (defaults to "dev" when unset).
#
# Use --env-file so ${HTTP_PORT}, Postgres defaults, and build args interpolate on the host.

services:
  postgres:
    container_name: expense-tracker-postgres
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense} -d ${POSTGRES_DB:-expense_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: expense-tracker-redis
    restart: unless-stopped
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  api:
    container_name: expense-tracker-api
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.api
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    env_file:
      - .env
    environment:
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-expense}:${POSTGRES_PASSWORD:-expense}@postgres:5432/${POSTGRES_DB:-expense_tracker}
      REDIS_URL: redis://redis:6379
      APP_VERSION: ${APP_VERSION:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "4000"
    volumes:
      - api_uploads:/app/uploads

  web:
    container_name: expense-tracker-web
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.web
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  api_uploads:
