# Production: PostgreSQL, Redis, API, and web from pre-built images (e.g. Docker Hub).
#
# Build and push images separately (see deployment/docker/Dockerfile.*), then set
# DOCKERHUB_USERNAME / IMAGE_TAG in .env or rely on defaults below.
#
# Copy deployment/docker-compose/.env.example to .env and set JWT_SECRET (16+ chars)
# and CLIENT_ORIGIN. The api service loads that file via env_file.
#
# From repo root:
#   npm run compose:prod
# Optional: npm run compose:prod:pull   # fetch newer images before up
#
# Manual:
#   docker compose -f deployment/docker-compose/docker-compose-prod.yml --env-file deployment/docker-compose/.env up -d
#
# Do not run this and docker-compose-build.yml on the same host at once (same container_name / volumes).

services:
  postgres:
    container_name: expense-tracker-postgres
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-expense} -d ${POSTGRES_DB:-expense_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    container_name: expense-tracker-redis
    restart: unless-stopped
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  api:
    container_name: expense-tracker-api
    restart: unless-stopped
    image: ${DOCKERHUB_USERNAME:-maxwayne}/expense-tracker-api:${IMAGE_TAG:-1.0}
    env_file:
      - .env
    environment:
      PORT: "4000"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-expense}:${POSTGRES_PASSWORD:-expense}@postgres:5432/${POSTGRES_DB:-expense_tracker}
      REDIS_URL: redis://redis:6379
      # Shown in GET /health and the UI footer; set to match what you deployed (e.g. same as IMAGE_TAG).
      APP_VERSION: ${APP_VERSION:-${IMAGE_TAG:-1.0}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "4000"
    volumes:
      - api_uploads:/app/uploads

  web:
    container_name: expense-tracker-web
    restart: unless-stopped
    image: ${DOCKERHUB_USERNAME:-maxwayne}/expense-tracker-web:${IMAGE_TAG:-1.0}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  api_uploads:
